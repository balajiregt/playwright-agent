name: "agent-loop"
version: 2
purpose: "Prompt intent selects a focused functional task before tool selection."
states:
  task_router:
    inputs: ["user request and exclusions", "selected project instructions"]
    guide: ".agents/skills/playwright-agent/SKILL.md"
    routes:
      authoring:
        skill: ".agents/skills/playwright-test-authoring/SKILL.md"
        when: "Requested create/edit/fix/refactor/run work; run-only does not authorize edits."
        sequence: ["relevant context", "inspect source and nearby tests", "requested changes", "focused checks", "findings and viewer"]
      assessment:
        skill: ".agents/skills/playwright-assessment/SKILL.md"
        when: "Explicit coverage, acceptance, matrix, gaps or duplicate assessment."
        sequence: ["requirements", "actual assertions", "requested findings or matrix", "report viewer"]
        execution: "Only when requested; no automatic edits or mutations."
      mutation:
        skill: ".agents/skills/playwright-mutation/SKILL.md"
        when: "Explicit mutation or executed application-fault verification."
        sequence: ["reviewed fault plan", "frozen tests", "healthy baselines", "one isolated fault", "activation probe", "repeat execution", "restore green", "report viewer"]
    combinations:
      assess_and_fix: ["assessment", "authoring"]
      create_and_mutate: ["authoring", "mutation"]
  mode_router:
    goal: "Select available MCP or CLI evidence tools inside the authorized task."
    guide: "docs/agent-workflow.md#prompt-mode-router"
  scope_router:
    goal: "Choose a direct owning-layer update or a spec for a broad new flow."
    guide: "contexts/flow-graph.yml"
  source_analyzer:
    goal: "Inspect relevant source; refresh manifests only for requested discovery or broad flow planning."
    guide: "contexts/source-map.yml"
  coverage_reviewer:
    goal: "Review actual assertion evidence for an explicitly requested assessment."
    guide: ".agents/skills/playwright-assessment/SKILL.md"
  capture:
    goal: "Collect only missing/stale page evidence needed by the selected task."
    guide: "contexts/capture-map.yml"
  planner:
    goal: "Specify broad new authoring flows when necessary; small edits need no new spec."
    guide: "contexts/flow-graph.yml"
  generator:
    goal: "Make requested test changes using existing framework layers."
    guide: ".agents/skills/playwright-test-authoring/SKILL.md"
  healer:
    goal: "Repair only when requested, using actual failure evidence."
    guide: "docs/agent-workflow.md#debugging-rules"
  reviewer:
    goal: "Check scoped changes, actual checks and private evidence; open the viewer last."
loop_guardrails:
  - "Route user intent before checking MCP/CLI availability."
  - "Do not infer requested stages from documents, quoted examples or negated words."
  - "Ordinary authoring does not require formal assessment, matrix, intake or mutation."
  - "Assessment and mutation require explicit requests."
  - "Nonfunctional testing is outside this agent's scope."
  - "Keep tests unchanged throughout each mutation measurement."
  - "Run-only requests do not authorize repairs."
  - "No extra model, provider, benchmark or publication is implied."
