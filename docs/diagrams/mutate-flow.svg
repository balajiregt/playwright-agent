<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 620" width="1400" height="620" role="img" aria-labelledby="t d"><title id="t">mutate-flow</title><desc id="d">npm run mutate hashes the original project, copies it, runs two green baselines, applies one fault to the copy, runs the tests twice and reports killed, survived, inconclusive or invalid, then proves the original unchanged.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b85"/></marker></defs><rect width="1400" height="620" fill="#0b1220"/><text x="60" y="70" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="34" font-weight="700" fill="#e6edf7" text-anchor="start">npm run mutate</text><text x="60" y="106" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#9fb0c8" text-anchor="start">One fault, proven by execution, without touching the original project</text><rect x="60" y="160" width="185" height="140" rx="12" fill="#161f30" stroke="#3a4a66" stroke-width="2"/><text x="80" y="194" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#e6edf7" text-anchor="start">1 · Hash</text><text x="80" y="223" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#9fb0c8" text-anchor="start">original project</text><text x="80" y="248" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#9fb0c8" text-anchor="start">fingerprinted</text><rect x="275" y="160" width="185" height="140" rx="12" fill="#0f2540" stroke="#4d9de0" stroke-width="2"/><text x="295" y="194" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#e6edf7" text-anchor="start">2 · Copy</text><text x="295" y="223" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#9fb0c8" text-anchor="start">into ignored</text><text x="295" y="248" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#9fb0c8" text-anchor="start">.mutation-work/</text><line x1="245" y1="230" x2="271" y2="230" stroke="#5b6b85" stroke-width="2.5" marker-end="url(#a)"/><rect x="490" y="160" width="185" height="140" rx="12" fill="#123020" stroke="#4cc38a" stroke-width="2"/><text x="510" y="194" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#e6edf7" text-anchor="start">3 · Baselines</text><text x="510" y="223" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#9fb0c8" text-anchor="start">tests run twice</text><text x="510" y="248" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#9fb0c8" text-anchor="start">must be green</text><line x1="460" y1="230" x2="486" y2="230" stroke="#5b6b85" stroke-width="2.5" marker-end="url(#a)"/><rect x="705" y="160" width="185" height="140" rx="12" fill="#33240c" stroke="#e0a33a" stroke-width="2"/><text x="725" y="194" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#e6edf7" text-anchor="start">4 · Fault</text><text x="725" y="223" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#9fb0c8" text-anchor="start">exact text, once,</text><text x="725" y="248" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#9fb0c8" text-anchor="start">in the copy only</text><line x1="675" y1="230" x2="701" y2="230" stroke="#5b6b85" stroke-width="2.5" marker-end="url(#a)"/><rect x="920" y="160" width="185" height="140" rx="12" fill="#3a1518" stroke="#e06666" stroke-width="2"/><text x="940" y="194" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#e6edf7" text-anchor="start">5 · Faulted runs</text><text x="940" y="223" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#9fb0c8" text-anchor="start">same tests</text><text x="940" y="248" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#9fb0c8" text-anchor="start">run twice</text><line x1="890" y1="230" x2="916" y2="230" stroke="#5b6b85" stroke-width="2.5" marker-end="url(#a)"/><rect x="1135" y="160" width="185" height="140" rx="12" fill="#211a3d" stroke="#8b7cf0" stroke-width="2"/><text x="1155" y="194" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#e6edf7" text-anchor="start">6 · Verdict</text><text x="1155" y="223" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#9fb0c8" text-anchor="start">copy deleted,</text><text x="1155" y="248" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#9fb0c8" text-anchor="start">hash re-checked</text><line x1="1105" y1="230" x2="1131" y2="230" stroke="#5b6b85" stroke-width="2.5" marker-end="url(#a)"/><rect x="60" y="350" width="300" height="90" rx="12" fill="#123020" stroke="#4cc38a" stroke-width="2"/><text x="80" y="384" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#e6edf7" text-anchor="start">killed</text><text x="80" y="413" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#9fb0c8" text-anchor="start">the same tests fail in both runs</text><rect x="382" y="350" width="300" height="90" rx="12" fill="#33240c" stroke="#e0a33a" stroke-width="2"/><text x="402" y="384" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#e6edf7" text-anchor="start">survived</text><text x="402" y="413" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#9fb0c8" text-anchor="start">every test passes with the fault</text><rect x="704" y="350" width="300" height="90" rx="12" fill="#161f30" stroke="#3a4a66" stroke-width="2"/><text x="724" y="384" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#e6edf7" text-anchor="start">inconclusive</text><text x="724" y="413" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#9fb0c8" text-anchor="start">unhealthy baseline or unstable</text><rect x="1026" y="350" width="300" height="90" rx="12" fill="#161f30" stroke="#3a4a66" stroke-width="2"/><text x="1046" y="384" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#e6edf7" text-anchor="start">invalid</text><text x="1046" y="413" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#9fb0c8" text-anchor="start">fault text must match once</text><rect x="60" y="480" width="1280" height="100" rx="12" fill="#161f30" stroke="#3a4a66" stroke-width="2"/><text x="90" y="520" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" font-weight="400" fill="#9fb0c8" text-anchor="start">$ npm run mutate -- --project examples/crm-scale --file app/api.mjs --find &quot;const total = round2(raw);&quot; …</text><text x="90" y="552" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" font-weight="400" fill="#4cc38a" text-anchor="start">VERDICT: killed · caught by quotes.spec.ts › quote totals: cents round half up · original project unchanged: yes</text></svg>
