<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 700" width="1400" height="700" role="img" aria-labelledby="t d"><title id="t">how-it-is-measured</title><desc id="d">Each task runs twice with Claude Opus: once alone with agent guidance removed, once with Playwright Agent. An independent oracle scores both, under rules frozen before any run.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b85"/></marker></defs><rect width="1400" height="700" fill="#0b1220"/><text x="60" y="70" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="34" font-weight="700" fill="#e6edf7" text-anchor="start">How the value is measured</text><text x="60" y="106" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#9fb0c8" text-anchor="start">Paired trials: the same model, prompt and project copy, with and without Playwright Agent</text><rect x="60" y="170" width="300" height="230" rx="12" fill="#161f30" stroke="#3a4a66" stroke-width="2"/><text x="80" y="204" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#e6edf7" text-anchor="start">One task</text><text x="80" y="233" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#9fb0c8" text-anchor="start">CRM-Scale: 11 modules,</text><text x="80" y="258" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#9fb0c8" text-anchor="start">5 roles, 216 tests,</text><text x="80" y="283" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#9fb0c8" text-anchor="start">90 acceptance criteria</text><text x="80" y="308" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#9fb0c8" text-anchor="start"></text><text x="80" y="333" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#9fb0c8" text-anchor="start">Frozen answer key:</text><text x="80" y="358" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#9fb0c8" text-anchor="start">every gap proven</text><text x="80" y="383" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#9fb0c8" text-anchor="start">with a real fault</text><rect x="450" y="150" width="380" height="120" rx="12" fill="#161f30" stroke="#3a4a66" stroke-width="2"/><text x="470" y="184" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#e6edf7" text-anchor="start">Arm A: Opus alone</text><text x="470" y="213" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#9fb0c8" text-anchor="start">project copy, all agent</text><text x="470" y="238" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#9fb0c8" text-anchor="start">guidance removed</text><rect x="450" y="300" width="380" height="120" rx="12" fill="#0f2f2c" stroke="#2bb3a3" stroke-width="2"/><text x="470" y="334" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#e6edf7" text-anchor="start">Arm B: Opus + Playwright Agent</text><text x="470" y="363" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#9fb0c8" text-anchor="start">same copy + router, one</text><text x="470" y="388" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#9fb0c8" text-anchor="start">skill, tools</text><path d="M360,250 C400,250 400,210 446,210" fill="none" stroke="#5b6b85" stroke-width="2.5" marker-end="url(#a)"/><path d="M360,320 C400,320 400,360 446,360" fill="none" stroke="#5b6b85" stroke-width="2.5" marker-end="url(#a)"/><rect x="920" y="170" width="420" height="230" rx="12" fill="#0f2540" stroke="#4d9de0" stroke-width="2"/><text x="940" y="204" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#e6edf7" text-anchor="start">Independent oracle</text><text x="940" y="233" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#9fb0c8" text-anchor="start">assessment: answer key</text><text x="940" y="258" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#9fb0c8" text-anchor="start">authoring: test must fail</text><text x="940" y="283" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#9fb0c8" text-anchor="start">  under the gap&#x27;s fault</text><text x="940" y="308" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#9fb0c8" text-anchor="start">mutation: verdict proven</text><text x="940" y="333" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#9fb0c8" text-anchor="start">  by execution, app restored</text><line x1="830" y1="210" x2="916" y2="240" stroke="#5b6b85" stroke-width="2.5" marker-end="url(#a)"/><line x1="830" y1="360" x2="916" y2="330" stroke="#5b6b85" stroke-width="2.5" marker-end="url(#a)"/><rect x="60" y="470" width="1280" height="150" rx="12" fill="#161f30" stroke="#3a4a66" stroke-width="2"/><text x="80" y="504" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#e6edf7" text-anchor="start">Rules written and frozen before any run</text><text x="90" y="552" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#9fb0c8" text-anchor="start">• accuracy first (margins fixed in advance)</text><text x="510" y="552" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#9fb0c8" text-anchor="start">• then safety and framework fit</text><text x="930" y="552" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#9fb0c8" text-anchor="start">• then tokens and cost per success</text><text x="90" y="586" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#9fb0c8" text-anchor="start">• arm order alternates · transcripts audited</text><text x="510" y="586" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#9fb0c8" text-anchor="start">• answer-key access excludes the run</text><text x="930" y="586" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#9fb0c8" text-anchor="start">• refused or blocked runs are disclosed</text></svg>
