<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" width="1400" height="800" role="img" aria-labelledby="t d"><title id="t">results-crm-scale</title><desc id="d">Paired trials on CRM-Scale with Claude Opus 5.5. Assessment, 15 pairs: gap recall 93.6% alone and 97.0% with Playwright Agent, no measurable difference under the frozen rules. Mutation proof, 12 pairs: correct verdicts 11 and 12, safe method 0 of 12 alone and 12 of 12 with Playwright Agent. Median cost was level.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b85"/></marker></defs><rect width="1400" height="800" fill="#0b1220"/><text x="60" y="70" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="34" font-weight="700" fill="#e6edf7" text-anchor="start">What it added to Claude Opus</text><text x="60" y="106" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#9fb0c8" text-anchor="start">CRM-Scale paired trials, rules frozen before the runs · grey = Opus alone · teal = Opus + Playwright Agent</text><rect x="60" y="150" width="620" height="300" rx="12" fill="#161f30" stroke="#3a4a66" stroke-width="2"/><text x="80" y="184" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#e6edf7" text-anchor="start">Assessment · 15 pairs</text><text x="660" y="184" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#9fb0c8" text-anchor="end">no measurable difference</text><text x="80" y="242" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#9fb0c8" text-anchor="start">Gap recall (all criteria)</text><rect x="80" y="252" width="393" height="14" rx="4" fill="#3a4a66"/><text x="512" y="265" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#9fb0c8" text-anchor="start">93.6% (247/264)</text><rect x="80" y="272" width="407" height="14" rx="4" fill="#2bb3a3"/><text x="512" y="285" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#2bb3a3" text-anchor="start">97.0% (256/264)</text><text x="80" y="314" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#9fb0c8" text-anchor="start">The 4 role-permission gaps</text><rect x="80" y="324" width="308" height="14" rx="4" fill="#3a4a66"/><text x="512" y="337" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#9fb0c8" text-anchor="start">44 / 60</text><rect x="80" y="344" width="364" height="14" rx="4" fill="#2bb3a3"/><text x="512" y="357" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#2bb3a3" text-anchor="start">52 / 60</text><text x="80" y="386" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#9fb0c8" text-anchor="start">Median cost per run</text><rect x="80" y="396" width="336" height="14" rx="4" fill="#3a4a66"/><text x="512" y="409" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#9fb0c8" text-anchor="start">$1.20</text><rect x="80" y="416" width="319" height="14" rx="4" fill="#2bb3a3"/><text x="512" y="429" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#2bb3a3" text-anchor="start">$1.14</text><rect x="720" y="150" width="620" height="300" rx="12" fill="#161f30" stroke="#3a4a66" stroke-width="2"/><text x="740" y="184" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#e6edf7" text-anchor="start">Mutation proof · 12 pairs</text><text x="1320" y="184" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#4cc38a" text-anchor="end">Playwright Agent adds value</text><text x="740" y="242" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#9fb0c8" text-anchor="start">Correct verdict, proven by execution</text><rect x="740" y="252" width="385" height="14" rx="4" fill="#3a4a66"/><text x="1172" y="265" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#9fb0c8" text-anchor="start">11 / 12</text><rect x="740" y="272" width="420" height="14" rx="4" fill="#2bb3a3"/><text x="1172" y="285" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#2bb3a3" text-anchor="start">12 / 12</text><text x="740" y="314" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#9fb0c8" text-anchor="start">Safe method (real source never edited)</text><rect x="740" y="324" width="4" height="14" rx="4" fill="#3a4a66"/><text x="1172" y="337" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#9fb0c8" text-anchor="start">0 / 12</text><rect x="740" y="344" width="420" height="14" rx="4" fill="#2bb3a3"/><text x="1172" y="357" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#2bb3a3" text-anchor="start">12 / 12</text><text x="740" y="386" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#9fb0c8" text-anchor="start">Median cost per run</text><rect x="740" y="396" width="315" height="14" rx="4" fill="#3a4a66"/><text x="1172" y="409" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#9fb0c8" text-anchor="start">$0.45</text><rect x="740" y="416" width="287" height="14" rx="4" fill="#2bb3a3"/><text x="1172" y="429" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#2bb3a3" text-anchor="start">$0.41</text><rect x="60" y="490" width="1280" height="250" rx="12" fill="#161f30" stroke="#3a4a66" stroke-width="2"/><text x="80" y="524" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#e6edf7" text-anchor="start">Read it carefully</text><text x="90" y="572" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#9fb0c8" text-anchor="start">• Assessment: +3.4 points recall and 8 pair wins to 3 losses, short of the +10-point margin fixed in advance.</text><text x="90" y="604" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#9fb0c8" text-anchor="start">• The coverage:matrix tool ran in only 3 of 15 runs, so it does not explain the role-gap gain.</text><text x="90" y="636" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#9fb0c8" text-anchor="start">• Mutation: Opus alone edited the real application in all 12 runs (and restored it); with Playwright Agent, 0 of 12.</text><text x="90" y="668" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#9fb0c8" text-anchor="start">• Cost was level (assessment: no measurable efficiency difference). Phase 2&#x27;s version cost more in 11 of 15 pairs.</text><text x="90" y="700" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#9fb0c8" text-anchor="start">• One model, one synthetic app, 27 pairs. Authoring was not re-run: Phase 2 tied 4 / 4.</text></svg>
