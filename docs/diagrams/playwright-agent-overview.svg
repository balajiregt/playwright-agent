<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" width="1400" height="760" role="img" aria-labelledby="t d"><title id="t">playwright-agent-overview</title><desc id="d">A request goes to a router skill, which loads one of three skills: test authoring, assessment or mutation proof. Each skill hands its repeatable work to a tool (the project&#x27;s tests, coverage:matrix, mutate) and returns evidence.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b85"/></marker></defs><rect width="1400" height="760" fill="#0b1220"/><text x="60" y="70" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="34" font-weight="700" fill="#e6edf7" text-anchor="start">Playwright Agent</text><text x="60" y="106" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#9fb0c8" text-anchor="start">An add-on for coding agents: short skills route the work, deterministic tools do the proving</text><rect x="60" y="170" width="230" height="170" rx="12" fill="#161f30" stroke="#3a4a66" stroke-width="2"/><text x="80" y="204" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#e6edf7" text-anchor="start">Request</text><text x="80" y="233" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#9fb0c8" text-anchor="start">&quot;Would our tests catch</text><text x="80" y="258" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#9fb0c8" text-anchor="start">a rounding bug in</text><text x="80" y="283" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#9fb0c8" text-anchor="start">quote totals?&quot;</text><rect x="330" y="170" width="200" height="170" rx="12" fill="#211a3d" stroke="#8b7cf0" stroke-width="2"/><text x="350" y="204" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#e6edf7" text-anchor="start">Router skill</text><text x="350" y="233" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#9fb0c8" text-anchor="start">reads the intent</text><text x="350" y="258" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#9fb0c8" text-anchor="start">and exclusions,</text><text x="350" y="283" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#9fb0c8" text-anchor="start">loads one skill</text><rect x="580" y="150" width="220" height="120" rx="12" fill="#0f2f2c" stroke="#2bb3a3" stroke-width="2"/><text x="600" y="184" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#e6edf7" text-anchor="start">Test authoring</text><text x="600" y="213" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#9fb0c8" text-anchor="start">create · edit · fix · run</text><rect x="840" y="150" width="250" height="120" rx="12" fill="#0f2f2c" stroke="#2bb3a3" stroke-width="2"/><text x="860" y="184" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#e6edf7" text-anchor="start">Tool</text><text x="860" y="213" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="400" fill="#2bb3a3" text-anchor="start">project&#x27;s own tests</text><rect x="1130" y="150" width="220" height="120" rx="12" fill="#161f30" stroke="#3a4a66" stroke-width="2"/><text x="1150" y="184" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#e6edf7" text-anchor="start">Evidence</text><text x="1150" y="213" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#9fb0c8" text-anchor="start">focused run</text><text x="1150" y="237" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#9fb0c8" text-anchor="start">framework fit</text><line x1="800" y1="210" x2="836" y2="210" stroke="#5b6b85" stroke-width="2.5" marker-end="url(#a)"/><line x1="1090" y1="210" x2="1126" y2="210" stroke="#5b6b85" stroke-width="2.5" marker-end="url(#a)"/><path d="M530,255 C555,255 555,210 576,210" fill="none" stroke="#5b6b85" stroke-width="2.5" marker-end="url(#a)"/><rect x="580" y="300" width="220" height="120" rx="12" fill="#0f2540" stroke="#4d9de0" stroke-width="2"/><text x="600" y="334" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#e6edf7" text-anchor="start">Assessment</text><text x="600" y="363" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#9fb0c8" text-anchor="start">criteria → assertions</text><rect x="840" y="300" width="250" height="120" rx="12" fill="#0f2540" stroke="#4d9de0" stroke-width="2"/><text x="860" y="334" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#e6edf7" text-anchor="start">Tool</text><text x="860" y="363" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="400" fill="#4d9de0" text-anchor="start">npm run coverage:matrix</text><rect x="1130" y="300" width="220" height="120" rx="12" fill="#161f30" stroke="#3a4a66" stroke-width="2"/><text x="1150" y="334" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#e6edf7" text-anchor="start">Evidence</text><text x="1150" y="363" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#9fb0c8" text-anchor="start">index of candidates</text><text x="1150" y="387" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#9fb0c8" text-anchor="start">findings per clause</text><line x1="800" y1="360" x2="836" y2="360" stroke="#5b6b85" stroke-width="2.5" marker-end="url(#a)"/><line x1="1090" y1="360" x2="1126" y2="360" stroke="#5b6b85" stroke-width="2.5" marker-end="url(#a)"/><path d="M530,255 C555,255 555,360 576,360" fill="none" stroke="#5b6b85" stroke-width="2.5" marker-end="url(#a)"/><rect x="580" y="450" width="220" height="120" rx="12" fill="#33240c" stroke="#e0a33a" stroke-width="2"/><text x="600" y="484" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#e6edf7" text-anchor="start">Mutation proof</text><text x="600" y="513" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#9fb0c8" text-anchor="start">would tests catch it?</text><rect x="840" y="450" width="250" height="120" rx="12" fill="#33240c" stroke="#e0a33a" stroke-width="2"/><text x="860" y="484" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#e6edf7" text-anchor="start">Tool</text><text x="860" y="513" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="400" fill="#e0a33a" text-anchor="start">npm run mutate</text><rect x="1130" y="450" width="220" height="120" rx="12" fill="#161f30" stroke="#3a4a66" stroke-width="2"/><text x="1150" y="484" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#e6edf7" text-anchor="start">Evidence</text><text x="1150" y="513" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#9fb0c8" text-anchor="start">verdict from execution</text><text x="1150" y="537" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#9fb0c8" text-anchor="start">original unchanged</text><line x1="800" y1="510" x2="836" y2="510" stroke="#5b6b85" stroke-width="2.5" marker-end="url(#a)"/><line x1="1090" y1="510" x2="1126" y2="510" stroke="#5b6b85" stroke-width="2.5" marker-end="url(#a)"/><path d="M530,255 C555,255 555,510 576,510" fill="none" stroke="#5b6b85" stroke-width="2.5" marker-end="url(#a)"/><line x1="290" y1="255" x2="326" y2="255" stroke="#5b6b85" stroke-width="2.5" marker-end="url(#a)"/><rect x="60" y="620" width="1290" height="90" rx="12" fill="#161f30" stroke="#3a4a66" stroke-width="2"/><text x="705" y="658" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#e6edf7" text-anchor="middle">Host coding agent (Claude Code, Codex, Copilot) makes every judgment. No extra model, hooks or servers.</text><text x="705" y="688" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#9fb0c8" text-anchor="middle">Guidance stays short (router + one skill ≈ 4 KB); repeatable work goes to tools that cannot skip steps.</text></svg>
