<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" width="1400" height="760" role="img" aria-labelledby="t d"><title id="t">coverage-matrix-example</title><desc id="d">For the criterion &#x27;only admins can read the audit log&#x27;, the suite checks the denial only for manager and sales. coverage:matrix flags that admin is never exercised and support and viewer are never checked.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b85"/></marker></defs><rect width="1400" height="760" fill="#0b1220"/><text x="60" y="70" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="34" font-weight="700" fill="#e6edf7" text-anchor="start">coverage:matrix finds what readers miss</text><text x="60" y="106" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#9fb0c8" text-anchor="start">Real output on CRM-Scale: a role rule whose denial is checked for two of five roles</text><rect x="60" y="150" width="1280" height="100" rx="12" fill="#161f30" stroke="#3a4a66" stroke-width="2"/><text x="80" y="184" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#e6edf7" text-anchor="start">PERM-AUDIT</text><text x="80" y="213" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#9fb0c8" text-anchor="start">&quot;Only admins can read the audit log; other roles see permission denied.&quot;</text><text x="90" y="300" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#9fb0c8" text-anchor="start">Role</text><text x="330" y="300" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#9fb0c8" text-anchor="start">Expected</text><text x="640" y="300" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#9fb0c8" text-anchor="start">Checked by the suite?</text><rect x="60" y="320" width="1280" height="48" rx="12" fill="#161f30" stroke="#3a4a66" stroke-width="2"/><text x="90" y="351" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#e6edf7" text-anchor="start">admin</text><text x="330" y="351" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#9fb0c8" text-anchor="start">can read</text><text x="640" y="351" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#e06666" text-anchor="start">✗ never exercised</text><rect x="60" y="378" width="1280" height="48" rx="12" fill="#161f30" stroke="#3a4a66" stroke-width="2"/><text x="90" y="409" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#e6edf7" text-anchor="start">manager</text><text x="330" y="409" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#9fb0c8" text-anchor="start">denied</text><text x="640" y="409" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#4cc38a" text-anchor="start">✓ audit.spec.ts:25 asserts denial</text><rect x="60" y="436" width="1280" height="48" rx="12" fill="#161f30" stroke="#3a4a66" stroke-width="2"/><text x="90" y="467" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#e6edf7" text-anchor="start">sales</text><text x="330" y="467" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#9fb0c8" text-anchor="start">denied</text><text x="640" y="467" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#4cc38a" text-anchor="start">✓ permissions-api.spec.ts:16 asserts denial</text><rect x="60" y="494" width="1280" height="48" rx="12" fill="#161f30" stroke="#3a4a66" stroke-width="2"/><text x="90" y="525" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#e6edf7" text-anchor="start">support</text><text x="330" y="525" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#9fb0c8" text-anchor="start">denied</text><text x="640" y="525" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#e06666" text-anchor="start">✗ never checked</text><rect x="60" y="552" width="1280" height="48" rx="12" fill="#161f30" stroke="#3a4a66" stroke-width="2"/><text x="90" y="583" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#e6edf7" text-anchor="start">viewer</text><text x="330" y="583" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#9fb0c8" text-anchor="start">denied</text><text x="640" y="583" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#e06666" text-anchor="start">✗ never checked</text><rect x="60" y="630" width="620" height="90" rx="12" fill="#0f2540" stroke="#4d9de0" stroke-width="2"/><text x="80" y="664" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" font-weight="400" fill="#4d9de0" text-anchor="start">Flag: allowed role never exercised: admin;</text><text x="80" y="690" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" font-weight="400" fill="#4d9de0" text-anchor="start">denial never checked for: support, viewer</text><rect x="720" y="630" width="620" height="90" rx="12" fill="#161f30" stroke="#3a4a66" stroke-width="2"/><text x="740" y="664" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#9fb0c8" text-anchor="start">A pointer, not proof: the agent still reads</text><text x="740" y="690" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#9fb0c8" text-anchor="start">each assertion before deciding coverage.</text></svg>
