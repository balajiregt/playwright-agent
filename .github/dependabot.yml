version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      # init and analyze must always move together, or CodeQL fails.
      codeql-action:
        patterns:
          - "github/codeql-action*"
  - package-ecosystem: npm
    directories:
      - /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
